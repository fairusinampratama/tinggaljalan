name: Deployment recovery safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/deployment-recovery-tests.yml
      - scripts/deployment/deploy-hostinger.sh
      - scripts/deployment/rollback-hostinger.sh
      - scripts/deployment/hosting-maintenance.py
      - app/Console/Commands/BackupDeploymentDatabase.php
      - database/migrations/**
      - tests/deployment/test_mysql_backup_restore.py
      - tests/deployment/test_production_recovery.py

permissions:
  contents: read

concurrency:
  group: recovery-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mysql-restore:
    name: Disposable MySQL backup restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-drill-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pdisposable-drill-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tj_backup_drill_source
      DB_USERNAME: root
      DB_PASSWORD: disposable-drill-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2; verified CI revision
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, dom, curl, zip, gd
          tools: composer:v2
          coverage: none
      - name: Install disposable application and database client
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client
          cp .env.example .env
          php artisan key:generate
      - name: Test real backup and isolated restore
        run: python3 tests/deployment/test_mysql_backup_restore.py
