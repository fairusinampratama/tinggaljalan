name: Read-only preview browser probe

on:
  workflow_dispatch:
    inputs:
      page:
        description: Public hub to inspect on the current protected preview
        type: choice
        options: [routes, news]
        default: routes

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/deployment/test_preview_startup_diagnostics.mjs
      - run: npx playwright install --with-deps chromium
      - name: Compare application handoff with network idle on the current preview
        env:
          PREVIEW_PROBE_PAGE: ${{ inputs.page }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: node scripts/testing/probe-preview-news.mjs
