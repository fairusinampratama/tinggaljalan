name: Approved WhatsApp protected preview

on:
  push:
    branches: [ops/whatsapp-preview-20261104]
    paths: [.github/workflows/approved-whatsapp-preview.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07f6373e63445af45fb105726120d27216545798
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Test real staging configuration helper
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php tests/deployment/test_staging_config.php
      - name: Check staging PHP formatting
        run: |
          FILES=(scripts/deployment/configure-staging.php scripts/deployment/staging-config.php tests/deployment/test_staging_config.php scripts/testing/staging-functional-guard.php scripts/testing/staging-preservation-readonly.php)
          if ! vendor/bin/pint --test "${FILES[@]}"; then
            vendor/bin/pint "${FILES[@]}"
            git diff -- "${FILES[@]}"
            exit 1
          fi
      - name: Validate staging scripts and refuse production root
        run: |
          bash -n scripts/deployment/deploy-staging.sh
          php -l scripts/deployment/configure-staging.php
          php -l scripts/deployment/staging-config.php
          php -l scripts/testing/staging-functional-guard.php
          php -l scripts/testing/staging-preservation-readonly.php
          node --check scripts/testing/staging-browser-smoke.mjs
          node --check scripts/testing/staging-functional-browser.mjs
          python3 tests/deployment/test_staging_secrets.py
          python3 tests/deployment/test_staging_deploy.py
          if bash scripts/deployment/deploy-staging.sh /home/u304629909/domains/tinggaljalan.com invalid invalid invalid invalid; then
            echo 'Production root was accepted.' >&2
            exit 1
          fi

  credentials:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07f6373e63445af45fb105726120d27216545798
      - name: Validate all credential fields before building
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: python3 scripts/deployment/prepare-staging-secrets.py

  build-test-package:
    if: github.event_name == 'push' && !false
    needs: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07f6373e63445af45fb105726120d27216545798
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, curl, zip, pdo_mysql, pdo_sqlite, sqlite3, gd
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build selected revision
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build:performance
      - name: Verify PHP and responsive browsers
        run: |
          php tests/deployment/test_staging_config.php
          composer test
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser
      - name: Package tested source and built frontend
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          composer check-platform-reqs --no-dev
          bash scripts/deployment/build-release.sh "07f6373e63445af45fb105726120d27216545798" "$RUNNER_TEMP/release-07f6373e63445af45fb105726120d27216545798.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-07f6373e63445af45fb105726120d27216545798
          path: ${{ runner.temp }}/release-07f6373e63445af45fb105726120d27216545798.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && !false
    needs: build-test-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://preview.tinggaljalan.com
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_ROOT: ${{ vars.STAGING_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07f6373e63445af45fb105726120d27216545798
      - uses: actions/download-artifact@v4
        with:
          name: staging-07f6373e63445af45fb105726120d27216545798
          path: ${{ runner.temp }}/release
      - name: Configure private staging transfer
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$STAGING_ROOT" == /home/u304629909/domains/preview.tinggaljalan.com ]]
          [[ "$SSH_HOST" == 153.92.9.54 && "$SSH_PORT" == 65002 && "$SSH_USER" == u304629909 ]]
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/staging-ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
          python3 scripts/deployment/prepare-staging-secrets.py "$RUNNER_TEMP/staging-ssh/config.json"
          cat > "$RUNNER_TEMP/staging-ssh/ssh_config" <<CONFIG
          Host staging
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile $RUNNER_TEMP/staging-ssh/key
              UserKnownHostsFile $RUNNER_TEMP/staging-ssh/known_hosts
              StrictHostKeyChecking yes
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 20
              ServerAliveInterval 10
              ServerAliveCountMax 2
          CONFIG
      - name: Validate destination before uploading
        run: |
          ssh -F "$RUNNER_TEMP/staging-ssh/ssh_config" staging \
            "bash -s -- readiness '$STAGING_ROOT'" < scripts/deployment/staging-preflight.sh
          ssh -F "$RUNNER_TEMP/staging-ssh/ssh_config" staging \
            "test ! -L '$STAGING_ROOT/deployments' && mkdir -p '$STAGING_ROOT/deployments/incoming' && test \"\$(readlink -f '$STAGING_ROOT/deployments/incoming')\" = '$STAGING_ROOT/deployments/incoming' && chmod 700 '$STAGING_ROOT/deployments/incoming'"
      - name: Transfer and deploy staging release
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/release/release-07f6373e63445af45fb105726120d27216545798.tar.gz"
          DIGEST="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          REMOTE_ARCHIVE="$STAGING_ROOT/deployments/incoming/release-07f6373e63445af45fb105726120d27216545798.tar.gz"
          REMOTE_CONFIG="$STAGING_ROOT/deployments/incoming/config-07f6373e63445af45fb105726120d27216545798.json"
          ssh -F "$RUNNER_TEMP/staging-ssh/ssh_config" staging \
            "test ! -L '$REMOTE_ARCHIVE' && test ! -L '$REMOTE_CONFIG'"
          scp -F "$RUNNER_TEMP/staging-ssh/ssh_config" "$ARCHIVE" "staging:$REMOTE_ARCHIVE"
          scp -F "$RUNNER_TEMP/staging-ssh/ssh_config" "$RUNNER_TEMP/staging-ssh/config.json" "staging:$REMOTE_CONFIG"
          ssh -F "$RUNNER_TEMP/staging-ssh/ssh_config" staging \
            "bash -s -- '$STAGING_ROOT' '07f6373e63445af45fb105726120d27216545798' '$REMOTE_ARCHIVE' '$DIGEST' '$REMOTE_CONFIG'" \
            < scripts/deployment/deploy-staging.sh
          printf '## Protected staging\n\nRevision: `%s`\n\nAuthenticated runtime and access protection checks passed. Database migrations are not automatically reversed.\n' "07f6373e63445af45fb105726120d27216545798" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify actual desktop and mobile rendering
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/testing/staging-browser-smoke.mjs "$RUNNER_TEMP/staging-ssh/config.json" "07f6373e63445af45fb105726120d27216545798" "$RUNNER_TEMP/staging-review"
      - name: Verify disabled gateways and synthetic booking flows after deployment
        if: ${{ false }}
        run: |
          ssh -F "$RUNNER_TEMP/staging-ssh/ssh_config" staging \
            "/opt/alt/php84/usr/bin/php /dev/stdin '07f6373e63445af45fb105726120d27216545798'" < scripts/testing/staging-functional-guard.php
          node scripts/testing/staging-functional-browser.mjs "$RUNNER_TEMP/staging-ssh/config.json" "07f6373e63445af45fb105726120d27216545798" "$RUNNER_TEMP/staging-review" "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-review-07f6373e63445af45fb105726120d27216545798-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-review
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary credentials
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/staging-ssh/ssh_config"; then
            ssh -F "$RUNNER_TEMP/staging-ssh/ssh_config" staging \
              "rm -f '$STAGING_ROOT/deployments/incoming/config-07f6373e63445af45fb105726120d27216545798.json'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/staging-ssh"

