name: Reclaim two obsolete preview code releases with preservation checks
on:
  push:
    branches: [ops/whatsapp-preview-diagnostics-20261104]
    paths: [.github/workflows/preview-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07f6373e63445af45fb105726120d27216545798
      - name: Inspect active release and access responses without changes
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          trap 'rm -rf -- "$RUNNER_TEMP/private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/known_hosts"
          python3 scripts/deployment/prepare-staging-secrets.py "$RUNNER_TEMP/private/config.json"
          ssh -p 65002 -i "$RUNNER_TEMP/private/key" -o UserKnownHostsFile="$RUNNER_TEMP/private/known_hosts" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 u304629909@153.92.9.54 'bash -s' <<'SH'
          set -eu
          root=/home/u304629909/domains/preview.tinggaljalan.com
          test "$(readlink -f "$root")" = "$root"
          test "$(cat "$root/.tinggaljalan-staging")" = preview.tinggaljalan.com
          exec 9>"$root/deployments/.lock"
          flock -n 9
          test "$(cat "$root/deployments/current/REVISION")" = 07f6373e63445af45fb105726120d27216545798
          test -d "$root/deployments/releases/8dc103bb510429e2e9f2e5654c6f1984538a5351"
          snapshot_before=$(/opt/alt/php84/usr/bin/php "$root/deployments/current/scripts/testing/staging-preservation-readonly.php" 07f6373e63445af45fb105726120d27216545798)
          env_before=$(sha256sum "$root/deployments/shared/.env" /home/u304629909/domains/tinggaljalan.com/deployments/shared/.env)
          for sha in 266178c2326768d871e4471ea189df9f91ef8a14 31164e9297dec003a0d937c1dd9ce8c0d0a0c5e9; do
            d="$root/deployments/releases/$sha"
            test "$(cat "$d/REVISION")" = "$sha"
            test "$(readlink -f "$root/deployments/current")" != "$d"
            test -L "$d/storage"
            test "$(readlink -f "$d/storage")" = "$root/deployments/shared/storage"
            test -L "$d/.env"
            test "$(readlink -f "$d/.env")" = "$root/deployments/shared/.env"
            echo "OBSOLETE_CODE_VALIDATED=$sha"
            stat -c '%y' "$d"
          done
          for sha in 266178c2326768d871e4471ea189df9f91ef8a14 31164e9297dec003a0d937c1dd9ce8c0d0a0c5e9; do
            d="$root/deployments/releases/$sha"
            test ! -L "$d"
            test "$(readlink -f "$d")" = "$d"
            test "$(readlink -f "$root/deployments/current")" != "$d"
            rm -rf -- "$d"
            echo "RECLAIMED_OBSOLETE_CODE=$sha"
          done
          snapshot_after=$(/opt/alt/php84/usr/bin/php "$root/deployments/current/scripts/testing/staging-preservation-readonly.php" 07f6373e63445af45fb105726120d27216545798)
          env_after=$(sha256sum "$root/deployments/shared/.env" /home/u304629909/domains/tinggaljalan.com/deployments/shared/.env)
          test "$snapshot_before" = "$snapshot_after"
          test "$env_before" = "$env_after"
          echo 'PRESERVATION_MATCHED_BOTH_DATABASES_LOGOS_MEDIA_ENV_REVISIONS'
          echo 'STORAGE_AND_QUOTA_READ_ONLY'
          df -Pk "$root"
          df -Pi "$root"
          if command -v quota >/dev/null 2>&1; then quota -s || true; fi
          du -sk "$root/deployments/releases" "$root/deployments/incoming" "$root/deployments/shared" /home/u304629909/domains/tinggaljalan.com/deployments/releases
          for d in "$root"/deployments/releases/*; do test ! -d "$d" || du -sk "$d"; done
          find "$root/deployments/incoming" -maxdepth 1 -type f -printf '%f %s bytes\\n'
          echo "ACTIVE_PREVIEW=$(cat "$root/deployments/current/REVISION")"
          echo "ACTIVE_PRODUCTION=$(cat /home/u304629909/domains/tinggaljalan.com/deployments/current/REVISION)"
          for p in / /up /admin/login /robots.txt; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://preview.tinggaljalan.com$p")
            echo "HOST_ANONYMOUS $p $code"
          done
          grep -E 'DirectoryIndex|FilesMatch|RewriteRule|Require|AuthType' "$root/public_html/.htaccess"
          ls -ld "$root/public_html/index-07f6373e63445af45fb105726120d27216545798.php"
          if test -e "$root/deployments/releases/07f6373e63445af45fb105726120d27216545798"; then echo CANDIDATE_RETAINED; else echo CANDIDATE_REMOVED; fi
          SH
          python3 - "$RUNNER_TEMP/private/config.json" <<'PY'
          import json,sys,urllib.request,urllib.error,base64
          cfg=json.load(open(sys.argv[1])); token=base64.b64encode(('reviewer:'+cfg['review_password']).encode()).decode()
          base='https://preview.tinggaljalan.com'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          for authenticated in [False,True]:
            for path in ['/','/up','/admin/login','/robots.txt']:
              headers={'Authorization':'Basic '+token} if authenticated else {}
              try:
                with opener.open(urllib.request.Request(base+path,headers=headers),timeout=25) as r:
                  body=r.read(); print('RUNNER',authenticated,path,r.status, json.loads(body) if path=='/up' else '')
              except urllib.error.HTTPError as e: print('RUNNER',authenticated,path,e.code)
          for path in ['/news/Bromo-wildfire','/news','/routes/BROMO']:
            for agent in ['Mozilla/5.0', 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)']:
              headers={'Authorization':'Basic '+token,'User-Agent':agent}
              try:
                with opener.open(urllib.request.Request(base+path,headers=headers),timeout=25) as r: print('INITIAL_HTML',path,'Googlebot' in agent,r.status)
              except urllib.error.HTTPError as e: print('INITIAL_HTML',path,'Googlebot' in agent,e.code)
          PY
