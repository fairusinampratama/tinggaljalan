name: Hosted readiness focused browser review
on:
  push:
    branches: [verify/package-upper-whatsapp-20261119]
    paths: [.github/workflows/package-whatsapp-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e35913b90a19f70036e8b674267d0bcb3962808a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify handoff under background traffic with real Chrome
        run: |
          cat > playwright.handoff.config.mjs <<'JS'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
              testDir: './tests/Browser',
              testMatch: 'hosted-browser-readiness.spec.js',
              use: { launchOptions: { executablePath: '/usr/bin/google-chrome' } },
          });
          JS
          npx playwright test --config=playwright.handoff.config.mjs
