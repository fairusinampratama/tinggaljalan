name: Staging SSH preflight
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only operation
        type: choice
        options: [connection, readiness, export-host-record]
        default: connection
permissions:
  contents: read
jobs:
  diagnose-preview-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Compare response status and rejection signatures without hosting writes
        env:
          REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          password = os.environ['REVIEW_PASSWORD']
          assert password
          for host in ['https://preview.tinggaljalan.com', 'https://tinggaljalan.com']:
              for label, ua in [('ordinary', 'Mozilla/5.0'), ('googlebot', 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)')]:
                  headers = {'User-Agent': ua}
                  if host == 'https://preview.tinggaljalan.com':
                      headers['Authorization'] = 'Basic ' + base64.b64encode(('reviewer:' + password).encode()).decode()
                  request = urllib.request.Request(host + '/news/Bromo-wildfire', headers=headers)
                  try:
                      response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
                  except urllib.error.HTTPError as error:
                      response = error
                  body = response.read(65536).decode('utf-8', 'replace')
                  title = re.search(r'<title[^>]*>(.*?)</title>', body, re.I | re.S)
                  markers = [phrase for phrase in ['bot verification', 'verify you are human', 'javascript', 'access denied', 'forbidden', 'litespeed', 'captcha', 'unauthorized'] if phrase in body.lower()]
                  result = {'host': host, 'agent': label, 'status': response.code, 'location': response.headers.get('Location'), 'server': response.headers.get('Server'), 'content_type': response.headers.get('Content-Type'), 'x_robots_tag': response.headers.get('X-Robots-Tag'), 'title': re.sub(r'\\s+', ' ', title.group(1)).replace(password, '[redacted]') if title else None, 'response_markers': markers, 'laravel_initial_html': 'server-seo-content' in body}
                  print(json.dumps(result), flush=True)
          PY
