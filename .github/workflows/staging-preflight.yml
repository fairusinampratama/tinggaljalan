name: Staging SSH preflight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Connection/readiness checks or explicit hosting maintenance
        type: choice
        options:
          - connection
          - readiness
          - crawler-parity
          - public-media-audit
          - public-media-generation-check
          - export-host-record
          - hosting-capacity
          - retention-plan
          - retention-apply
        default: connection
  pull_request:
    paths:
      - .github/workflows/staging-preflight.yml
      - scripts/deployment/staging-preflight.sh
      - scripts/deployment/preview-media-audit.php
      - scripts/deployment/preview-media-generation-check.php
      - tests/deployment/test_preview_media_audit.php
      - scripts/testing/preview-http-diagnostics.py
      - scripts/testing/verify-preview-crawler.py
      - tests/deployment/test_preview_http_diagnostics.py
      - scripts/deployment/prepare-staging-secrets.py
      - scripts/deployment/hosting-maintenance.py
      - tests/deployment/test_hosting_maintenance.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2; verified CI revision
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, dom
          coverage: none
      - name: Validate script syntax
        run: |
          bash -n scripts/deployment/staging-preflight.sh
          python3 tests/deployment/test_preview_http_diagnostics.py
          python3 tests/deployment/test_hosting_maintenance.py
          php -l scripts/deployment/preview-media-generation-check.php
          php -l scripts/deployment/preview-media-audit.php
          php tests/deployment/test_preview_media_audit.php

  connection:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'connection' || inputs.operation == 'readiness' || inputs.operation == 'crawler-parity' || inputs.operation == 'public-media-audit' || inputs.operation == 'public-media-generation-check')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_ROOT: ${{ vars.STAGING_ROOT }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
      - name: Validate staging credentials without revealing values
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: python3 scripts/deployment/prepare-staging-secrets.py
      - name: Configure pinned SSH access
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          if [[ "$OPERATION" == readiness || "$OPERATION" == crawler-parity || "$OPERATION" == public-media-audit || "$OPERATION" == public-media-generation-check ]]; then
            [[ "$STAGING_ROOT" =~ ^/home/[a-zA-Z0-9_-]+/domains/preview[.]tinggaljalan[.]com$ ]]
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/staging-ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
      - name: Inspect staging prerequisites without changing hosting
        run: |
          CHECK_MODE="$OPERATION"
          if [[ "$CHECK_MODE" == crawler-parity || "$CHECK_MODE" == public-media-audit || "$CHECK_MODE" == public-media-generation-check ]]; then CHECK_MODE=readiness; fi
          ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$CHECK_MODE' '$STAGING_ROOT'" \
            < scripts/deployment/staging-preflight.sh
      - name: Compare preview HTTP responses without changing hosting
        if: inputs.operation != 'crawler-parity' && inputs.operation != 'public-media-audit' && inputs.operation != 'public-media-generation-check'
        env:
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: |
          python3 scripts/testing/preview-http-diagnostics.py
          python3 - <<'PYCODE'
          import json, os, shlex, subprocess
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'staging-ssh'
          source = Path('scripts/testing/preview-http-diagnostics.py').read_text()
          command = 'python3 -c ' + shlex.quote(source) + ' --stdin-password'
          arguments = ['ssh', '-i', str(directory / 'key'), '-p', os.environ['SSH_PORT'],
                       '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'StrictHostKeyChecking=yes',
                       '-o', 'UserKnownHostsFile=' + str(directory / 'known_hosts'),
                       '-o', 'ConnectTimeout=20', '-o', 'ServerAliveInterval=10', '-o', 'ServerAliveCountMax=2',
                       os.environ['SSH_USER'] + '@' + os.environ['SSH_HOST'], command]
          try:
              result = subprocess.run(arguments, input=json.dumps({'review_password': os.environ['STAGING_REVIEW_PASSWORD']}),
                                      capture_output=True, text=True, timeout=90)
              assert result.returncode == 0 and len(result.stdout) < 4096
              records = [json.loads(line) for line in result.stdout.splitlines()]
              assert len(records) == 4
              for record in records:
                  assert set(record) == {'location', 'kind', 'authentication', 'status', 'category', 'noindex', 'basic_challenge'}
                  assert record['authentication'] in ('preemptive', 'challenge')
                  assert record['location'] == 'hosting' and record['kind'] in ('ordinary', 'crawler')
                  assert type(record['status']) is int and 0 <= record['status'] <= 599
                  assert record['category'] in ('http-response', 'transport-error', 'security-screen', 'litespeed-forbidden')
                  assert type(record['noindex']) is bool and type(record['basic_challenge']) is bool
              for record in records:
                  print(json.dumps(record, sort_keys=True))
          except Exception:
              raise SystemExit('Host-side HTTP diagnostics failed; request details withheld.')
          PYCODE
      - name: Diagnose current preview crawler parity without publishing
        if: inputs.operation == 'crawler-parity'
        env:
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import importlib.util, json, os, shlex, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('crawler', 'scripts/testing/verify-preview-crawler.py')
          crawler = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(crawler)
          directory = Path(os.environ['RUNNER_TEMP']) / 'staging-ssh'
          source = Path('scripts/testing/preview-http-diagnostics.py').read_text()
          command = 'python3 -c ' + shlex.quote(source) + ' --probe-crawler'
          arguments = ['ssh', '-i', str(directory / 'key'), '-p', os.environ['SSH_PORT'],
                       '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'StrictHostKeyChecking=yes',
                       '-o', 'UserKnownHostsFile=' + str(directory / 'known_hosts'),
                       '-o', 'ConnectTimeout=20', '-o', 'ServerAliveInterval=10', '-o', 'ServerAliveCountMax=2',
                       os.environ['SSH_USER'] + '@' + os.environ['SSH_HOST'], command]
          try:
              result = subprocess.run(arguments, input=json.dumps({'review_password': os.environ['STAGING_REVIEW_PASSWORD']}),
                                      capture_output=True, text=True, timeout=300)
              print(json.dumps(crawler.parse_evidence(result), sort_keys=True))
          except crawler.http.CrawlerCheckError as error:
              print(json.dumps({'failure': crawler.http.safe_crawler_failure(error.evidence)}, sort_keys=True))
              raise SystemExit('Crawler parity diagnosis failed; private request details withheld.')
          except subprocess.TimeoutExpired:
              raise SystemExit('Crawler parity diagnosis timed out; private request details withheld.')
          except Exception:
              raise SystemExit('Crawler parity diagnosis failed; untrusted output withheld.')
          PYCODE
      - name: Audit public image references without changing hosting
        if: inputs.operation == 'public-media-audit'
        run: |
          ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" '/opt/alt/php84/usr/bin/php /dev/stdin' \
            < scripts/deployment/preview-media-audit.php
      - name: Check actual responsive generation in private preview scratch storage
        if: inputs.operation == 'public-media-generation-check'
        run: |
          set -euo pipefail
          [[ "$STAGING_ROOT" == /home/u304629909/domains/preview.tinggaljalan.com ]]
          REMOTE="$STAGING_ROOT/deployments/incoming/media-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH=(ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "umask 077; test ! -e '$REMOTE' && test ! -L '$REMOTE' && mkdir '$REMOTE' && test \"\$(readlink -f '$REMOTE')\" = '$REMOTE'"
          echo "MEDIA_CHECK_REMOTE=$REMOTE" >> "$GITHUB_ENV"
          scp -i "$RUNNER_TEMP/staging-ssh/key" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            scripts/deployment/preview-db-refresh-lib.php scripts/deployment/preview-media-refresh-lib.php scripts/deployment/preview-db-schema.json scripts/deployment/preview-media-audit.php scripts/deployment/preview-media-generation-check.php "$SSH_USER@$SSH_HOST:$REMOTE/"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "/opt/alt/php84/usr/bin/php '$REMOTE/preview-media-generation-check.php'"
      - name: Remove this run's private diagnostic workspace
        if: always() && inputs.operation == 'public-media-generation-check'
        run: |
          if test -n "${MEDIA_CHECK_REMOTE:-}" && test -f "$RUNNER_TEMP/staging-ssh/key"; then
            [[ "$MEDIA_CHECK_REMOTE" == "/home/u304629909/domains/preview.tinggaljalan.com/deployments/incoming/media-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
            ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
              "$SSH_USER@$SSH_HOST" "if test -d '$MEDIA_CHECK_REMOTE' && test ! -L '$MEDIA_CHECK_REMOTE' && test \"\$(readlink -f '$MEDIA_CHECK_REMOTE')\" = '$MEDIA_CHECK_REMOTE'; then rm -rf -- '$MEDIA_CHECK_REMOTE'; fi"
          fi
      - name: Record result
        run: |
          if [[ "$OPERATION" == public-media-generation-check ]]; then
            printf '## Media generation diagnostic\n\nActual preview generator and responsive verification passed in private scratch storage. Both databases were query-only; running preview content/configuration and production files were unchanged. Temporary copies were removed.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Staging preflight\n\nSelected read-only check passed. Connection mode does not establish staging readiness. No hosting files were changed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove runner credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/staging-ssh"

  export-host-record:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'export-host-record'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Extract existing public server identity
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          RECORDS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # These are the independently observed staging endpoint details.
          [[ "$HOST" == 153.92.9.54 && "$PORT" == 65002 ]]
          test -n "$RECORDS"
          umask 077
          printf '%s\n' "$RECORDS" > "$RUNNER_TEMP/existing-known-hosts"
          ssh-keygen -F "[$HOST]:$PORT" -f "$RUNNER_TEMP/existing-known-hosts" \
            | sed '/^#/d' > "$RUNNER_TEMP/staging-known-hosts"
          test -s "$RUNNER_TEMP/staging-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/staging-known-hosts" >/dev/null
          printf 'Matched existing production host record to the configured staging endpoint. No SSH session or deployment was started.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public host record for staging configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified CI revision
        with:
          name: staging-host-record-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-known-hosts
          retention-days: 1
          if-no-files-found: error

  hosting-maintenance:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'hosting-capacity' || inputs.operation == 'retention-plan' || inputs.operation == 'retention-apply')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: hosting-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
      - name: Prepare pinned hosting access
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" == 153.92.9.54 && "$SSH_PORT" == 65002 && "$SSH_USER" == u304629909 ]]
          test -n "$PRIVATE_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/hosting-ssh" "$RUNNER_TEMP/hosting-recovery"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/hosting-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/hosting-ssh/known_hosts"
          cat > "$RUNNER_TEMP/hosting-ssh/config" <<CONFIG
          Host hosting
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile $RUNNER_TEMP/hosting-ssh/key
              UserKnownHostsFile $RUNNER_TEMP/hosting-ssh/known_hosts
              StrictHostKeyChecking yes
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 20
              ServerAliveInterval 10
              ServerAliveCountMax 3
          CONFIG
      - name: Read-only capacity alert
        if: inputs.operation == 'hosting-capacity'
        run: |
          ssh -F "$RUNNER_TEMP/hosting-ssh/config" hosting 'python3 - capacity --alert' < scripts/deployment/hosting-maintenance.py
      - name: Verify production and print retention plans
        if: inputs.operation != 'hosting-capacity'
        run: |
          set -euo pipefail
          bash scripts/deployment/production-smoke-test.sh https://tinggaljalan.com
          for environment in preview production; do
            ssh -F "$RUNNER_TEMP/hosting-ssh/config" hosting "python3 - retention $environment" < scripts/deployment/hosting-maintenance.py
          done
      - name: Archive expired immutable releases without private runtime data
        if: inputs.operation == 'retention-apply'
        run: |
          set -euo pipefail
          for environment in preview production; do
            ssh -F "$RUNNER_TEMP/hosting-ssh/config" hosting "python3 - archive-obsolete $environment" \
              < scripts/deployment/hosting-maintenance.py > "$RUNNER_TEMP/hosting-recovery/$environment.tar.gz"
            gzip -t "$RUNNER_TEMP/hosting-recovery/$environment.tar.gz"
          done
          python3 - <<'PYCODE'
          import json, os, re, tarfile
          from pathlib import Path
          for environment in ['preview', 'production']:
              path = Path(os.environ['RUNNER_TEMP']) / 'hosting-recovery' / (environment + '.tar.gz')
              with tarfile.open(path) as archive:
                  manifest = json.load(archive.extractfile('MANIFEST.json'))
                  assert re.fullmatch('[0-9a-f]{64}', manifest['digest'])
                  allowed = {r['sha'] for r in manifest['plan']['releases'] if r['action'] == 'remove'}
                  for member in archive.getmembers():
                      if member.name == 'MANIFEST.json': continue
                      parts = Path(member.name).parts
                      assert parts[0] in allowed and '..' not in parts and not member.name.startswith('/')
                      assert not member.issym() and not member.islnk() and not member.isdev()
                      assert not any(p == '.env' or p.startswith('.env.') or p == 'storage' for p in parts[1:])
                      assert parts[1:3] != ('bootstrap', 'cache')
                  print(environment, 'recovery archive verified; expired releases:', len(allowed))
          PYCODE
      - name: Preserve verified recovery archives before deleting expired releases
        if: inputs.operation == 'retention-apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified CI revision
        with:
          name: hosting-expired-release-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/hosting-recovery/*.tar.gz
          retention-days: 90
          if-no-files-found: error
      - name: Apply exactly the archived retention plans
        if: inputs.operation == 'retention-apply'
        run: |
          set -euo pipefail
          for environment in preview production; do
            DIGEST="$(python3 -c 'import json,sys,tarfile; a=tarfile.open(sys.argv[1]); print(json.load(a.extractfile("MANIFEST.json"))["digest"])' "$RUNNER_TEMP/hosting-recovery/$environment.tar.gz")"
            [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
            ssh -F "$RUNNER_TEMP/hosting-ssh/config" hosting "python3 - retention $environment --apply --expected-plan $DIGEST" < scripts/deployment/hosting-maintenance.py
          done
      - name: Verify production after retention review or cleanup
        if: inputs.operation != 'hosting-capacity'
        run: bash scripts/deployment/production-smoke-test.sh https://tinggaljalan.com
      - name: Verify headroom for the next deployment
        if: inputs.operation == 'retention-apply'
        run: |
          ssh -F "$RUNNER_TEMP/hosting-ssh/config" hosting 'python3 - capacity --reserve' < scripts/deployment/hosting-maintenance.py
      - name: Record maintenance result
        if: always()
        run: |
          echo '## Hosting maintenance' >> "$GITHUB_STEP_SUMMARY"
          echo 'Operation: ${{ inputs.operation }}; result: ${{ job.status }}. See sanitized capacity and release-policy output in job logs.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/hosting-ssh"
