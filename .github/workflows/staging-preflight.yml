name: Staging SSH preflight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (database refresh replaces preview data)
        type: choice
        options:
          - connection
          - readiness
          - database-audit
          - repair-preview-logo
          - refresh-preview-database
          - export-host-record
        default: connection
  pull_request:
    paths:
      - .github/workflows/staging-preflight.yml
      - scripts/deployment/staging-preflight.sh
      - scripts/deployment/prepare-staging-secrets.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Verify branding preservation and deployment rollback
        run: |
          php -l scripts/deployment/repair-preview-logo.php
          php -l scripts/deployment/configure-staging.php
          python3 tests/deployment/test_staging_deploy.py
      - name: Validate script syntax
        run: bash -n scripts/deployment/staging-preflight.sh

  connection:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'export-host-record' && inputs.operation != 'refresh-preview-database'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_ROOT: ${{ vars.STAGING_ROOT }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging credentials without revealing values
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: python3 scripts/deployment/prepare-staging-secrets.py
      - name: Configure pinned SSH access
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          if [[ "$OPERATION" == readiness ]]; then
            [[ "$STAGING_ROOT" =~ ^/home/[a-zA-Z0-9_-]+/domains/preview[.]tinggaljalan[.]com$ ]]
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/staging-ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
      - name: Inspect real database schema without row values
        if: inputs.operation == 'database-audit'
        run: |
          ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "/opt/alt/php84/usr/bin/php /dev/stdin" \
            < scripts/deployment/preview-db-audit.php
      - name: Restore copied public logo without touching production
        if: inputs.operation == 'repair-preview-logo'
        run: |
          ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "/opt/alt/php84/usr/bin/php /dev/stdin" \
            < scripts/deployment/repair-preview-logo.php
      - name: Inspect staging prerequisites without changing hosting
        if: inputs.operation != 'database-audit' && inputs.operation != 'repair-preview-logo'
        run: |
          ssh -i "$RUNNER_TEMP/staging-ssh/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$OPERATION' '$STAGING_ROOT'" \
            < scripts/deployment/staging-preflight.sh
      - name: Inspect existing preview authentication without changing hosting
        env:
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request('https://preview.tinggaljalan.com/')
          token = base64.b64encode(('reviewer:' + os.environ['STAGING_REVIEW_PASSWORD']).encode()).decode()
          request.add_header('Authorization', 'Basic ' + token)
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              code = response.status
          except urllib.error.HTTPError as error:
              code = error.code
              response = error
          print('Existing preview authenticated HTTP status:', code)
          print('Preview PHP header:', response.headers.get('X-Powered-By', 'not advertised'))
          body = response.read(16384)
          print('Preview setup placeholder returned:', b'Preview setup incomplete' in body)
          if os.environ['OPERATION'] == 'repair-preview-logo':
              import re, html, json, hashlib
              body += response.read()
              match = re.search(r'data-page=([\"\'])(.*?)\1', body.decode(), re.S)
              assert match, 'Missing public page payload'
              payload = json.loads(html.unescape(match.group(2)))
              logo = payload['props']['publicData']['site']['logoUrl']
              assert logo.startswith('/storage/admin/preview-refresh/'), 'Logo still uses a fallback'
              image_request = urllib.request.Request('https://preview.tinggaljalan.com' + logo)
              image_request.add_header('Authorization', 'Basic ' + token)
              image = urllib.request.urlopen(image_request, timeout=30).read()
              assert hashlib.sha256(image).hexdigest() == logo.rsplit('/', 1)[1].split('.')[0], 'Copied logo bytes mismatch'
              print('Authenticated preview logo URL:', logo)
              print('Copied logo HTTP bytes match production content hash: yes')
          PY
      - name: Record result
        run: |
          printf '## Staging preflight\n\nSelected read-only check passed. Connection mode does not establish staging readiness. No hosting files were changed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/staging-ssh"

  export-host-record:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'export-host-record'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Extract existing public server identity
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          RECORDS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # These are the independently observed staging endpoint details.
          [[ "$HOST" == 153.92.9.54 && "$PORT" == 65002 ]]
          test -n "$RECORDS"
          umask 077
          printf '%s\n' "$RECORDS" > "$RUNNER_TEMP/existing-known-hosts"
          ssh-keygen -F "[$HOST]:$PORT" -f "$RUNNER_TEMP/existing-known-hosts" \
            | sed '/^#/d' > "$RUNNER_TEMP/staging-known-hosts"
          test -s "$RUNNER_TEMP/staging-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/staging-known-hosts" >/dev/null
          printf 'Matched existing production host record to the configured staging endpoint. No SSH session or deployment was started.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public host record for staging configuration
        uses: actions/upload-artifact@v4
        with:
          name: staging-host-record-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-known-hosts
          retention-days: 1
          if-no-files-found: error

  refresh-preview-database:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'refresh-preview-database'
    uses: ./.github/workflows/preview-database-refresh.yml
    secrets: inherit
