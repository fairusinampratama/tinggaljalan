name: Staging SSH preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Read-only production incident diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hosting without changing production
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/incident-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/incident-ssh"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/incident-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/incident-ssh/known_hosts"
          SSH=(ssh -i "$RUNNER_TEMP/incident-ssh/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/incident-ssh/known_hosts" -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST")
          "${SSH[@]}" 'date -u; df -Pk /home/u304629909; df -Pi /home/u304629909; uptime; quota -s 2>/dev/null || true'
          "${SSH[@]}" '/opt/alt/php84/usr/bin/php /dev/stdin' < scripts/deployment/incident-diagnose.php
          "${SSH[@]}" 'du -x --inodes --max-depth=2 /home/u304629909/domains/tinggaljalan.com/deployments /home/u304629909/domains/preview.tinggaljalan.com/deployments | sort -nr | head -35'
