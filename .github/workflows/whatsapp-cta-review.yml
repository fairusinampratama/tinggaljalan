name: WhatsApp CTA isolated visual review
on:
  push:
    branches: [verify/whatsapp-cta-review-20261104]
    paths: [.github/workflows/whatsapp-cta-review.yml, tests/Browser/whatsapp-visual.local.spec.js]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare isolated application and baseline
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build:performance
          npm run test:browser:prepare
          npx playwright install --with-deps chromium
          git worktree add --detach ../whatsapp-before e2a7140e5f2c2b34b03b8764b7f234fb422aaa6d
          ln -s "$GITHUB_WORKSPACE/vendor" ../whatsapp-before/vendor
          ln -s "$GITHUB_WORKSPACE/node_modules" ../whatsapp-before/node_modules
          cp .env ../whatsapp-before/.env
          (cd ../whatsapp-before && npm run build:performance)
      - name: Render baseline and candidate against synthetic local database
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          GOOGLE_ADS_CONSENT_ENABLED: 'true'
          GOOGLE_ANALYTICS_ENABLED: 'true'
          GOOGLE_TAG_MANAGER_ENABLED: 'true'
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: database
        run: |
          export DB_DATABASE="$GITHUB_WORKSPACE/storage/framework/testing/browser.sqlite"
          (cd ../whatsapp-before && APP_URL=http://127.0.0.1:4174 php artisan serve --host=127.0.0.1 --port=4174 --no-reload) > /tmp/before.log 2>&1 &
          APP_URL=http://127.0.0.1:4173 php artisan serve --host=127.0.0.1 --port=4173 --no-reload > /tmp/after.log 2>&1 &
          for port in 4173 4174; do
            for attempt in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/up" && break
              sleep 1
            done
          done
          npx playwright test tests/Browser/whatsapp-visual.local.spec.js --project=desktop-chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-cta-before-after
          path: |
            whatsapp-cta-review
            test-results
          retention-days: 14
