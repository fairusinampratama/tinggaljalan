name: Read-only release capacity inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Inspect deployment artifacts without modifying hosting
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DOMAIN_ROOT: ${{ secrets.PROD_DOMAIN_ROOT }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/capacity-readonly"
          mkdir -p "$private"
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$private/known_hosts"
          ssh -p "$SSH_PORT" -i "$private/key" \
            -o UserKnownHostsFile="$private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DOMAIN_ROOT'" <<'REMOTE'
          set -euo pipefail
          root="$1"
          [[ "$root" == /home/*/domains/tinggaljalan.com ]]
          [[ "$(readlink -f "$root")" == "$root" ]]
          current="$(readlink -f "$root/deployments/current")"
          [[ "$current" == "$root/deployments/releases/"* ]]
          printf 'ACTIVE_REVISION=%s\n' "$(cat "$current/REVISION")"
          df -Pk "$root"
          quota -s 2>/dev/null || true
          for directory in incoming releases shared; do
            du -sk "$root/deployments/$directory"
          done
          echo PRODUCTION_RELEASE_DIRECTORIES
          find "$root/deployments/releases" -mindepth 1 -maxdepth 1 -type d -print0 | xargs -0 -r du -sk
          echo PRODUCTION_ARCHIVES
          find "$root/deployments/incoming" -mindepth 1 -maxdepth 1 -type f -name 'release-*.tar.gz*' -printf '%f %s bytes %TY-%Tm-%Td\n' | sort
          echo SHARED_STORAGE_TOTALS
          du -sk "$root/deployments/shared/storage/app/public" "$root/deployments/shared/backups" 2>/dev/null || true
          preview="$(dirname "$root")/preview.tinggaljalan.com"
          if [[ -d "$preview/deployments" && ! -L "$preview/deployments" ]]; then
            echo PREVIEW_DEPLOYMENT_TOTALS
            du -sk "$preview/deployments/incoming" "$preview/deployments/releases" "$preview/deployments/shared" 2>/dev/null || true
          fi
          REMOTE
