name: Guarded obsolete preview code cleanup
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Permanently remove ONLY preview releases 501eb36 and d19c49f after owner confirmation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Inspect or apply exact preview-only cleanup
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          umask 077
          private="$(mktemp -d)"
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$private/known_hosts"
          mode=inspect
          [[ "$APPLY" != true ]] || mode=apply
          ssh -p "$SSH_PORT" -i "$private/key" -o UserKnownHostsFile="$private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$mode'" < scripts/deployment/cleanup-obsolete-preview-code.sh
