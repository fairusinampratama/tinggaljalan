name: Read-only GA4 release capacity inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Inspect deployment artifact sizes without changing hosting
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DOMAIN_ROOT: ${{ secrets.PROD_DOMAIN_ROOT }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/readonly-capacity"
          mkdir -p "$private"
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$private/known_hosts"
          ssh -p "$SSH_PORT" -i "$private/key" \
            -o UserKnownHostsFile="$private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DOMAIN_ROOT'" <<'REMOTE'
          set -euo pipefail
          root="$1"
          [[ "$root" == /home/*/domains/tinggaljalan.com ]]
          [[ "$(readlink -f "$root")" == "$root" ]]
          current="$(readlink -f "$root/deployments/current")"
          [[ "$current" == "$root/deployments/releases/"* ]]
          printf 'ACTIVE_REVISION=%s\n' "$(cat "$current/REVISION")"
          for directory in incoming releases shared; do
            printf 'TOTAL_KIB %s %s\n' "$directory" "$(du -sk "$root/deployments/$directory" | cut -f1)"
          done
          echo RELEASE_INVENTORY
          while IFS= read -r release; do
            name="$(basename "$release")"
            [[ "$name" =~ ^[0-9a-f]{40}$ ]] || continue
            active=no; [[ "$release" != "$current" ]] || active=yes
            revision=missing; [[ ! -f "$release/REVISION" ]] || revision="$(cat "$release/REVISION")"
            printf 'RELEASE %s KIB=%s ACTIVE=%s REVISION=%s\n' "$name" "$(du -sk "$release" | cut -f1)" "$active" "$revision"
          done < <(find "$root/deployments/releases" -mindepth 1 -maxdepth 1 -type d -printf '%p\n' | sort)
          echo ARCHIVE_INVENTORY
          find "$root/deployments/incoming" -mindepth 1 -maxdepth 1 -type f -name 'release-*.tar.gz*' -printf '%f %s bytes\n' | sort
          printf 'GA4_FAILED_DIRECTORY_PRESENT='
          if test -e "$root/deployments/releases/d2cb8d2fd3d1d098b20255f3521ee0cc55cde570"; then echo yes; else echo no; fi
          REMOTE
