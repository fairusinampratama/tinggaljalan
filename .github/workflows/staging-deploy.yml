name: Protected staging deployment

on:
  workflow_dispatch:
    inputs:
      review_only:
        description: Review the existing preview without deploying
        type: boolean
        default: true
      production_revision:
        description: Optional production SHA for read-only production browser review
        type: string
        default: ''
      functional_checks:
        description: Submit synthetic bookings and verify admin sign-in (preview only)
        type: boolean
        default: false
      revision:
        description: Exact existing preview revision for review-only runs
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/staging-deploy.yml
      - scripts/deployment/deploy-staging.sh
      - scripts/deployment/configure-staging.php
      - scripts/deployment/staging-config.php
      - scripts/deployment/prepare-staging-secrets.py
      - tests/deployment/test_staging_config.php
      - tests/deployment/test_staging_secrets.py
      - .env.staging.example
      - tests/deployment/test_staging_deploy.py
      - scripts/testing/staging-browser-smoke.mjs
      - scripts/testing/staging-functional-browser.mjs
      - scripts/testing/staging-functional-guard.php

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Test real staging configuration helper
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php tests/deployment/test_staging_config.php
      - name: Check staging PHP formatting
        run: |
          FILES=(scripts/deployment/configure-staging.php scripts/deployment/staging-config.php tests/deployment/test_staging_config.php scripts/testing/staging-functional-guard.php scripts/testing/staging-preservation-readonly.php)
          if ! vendor/bin/pint --test "${FILES[@]}"; then
            vendor/bin/pint "${FILES[@]}"
            git diff -- "${FILES[@]}"
            exit 1
          fi
      - name: Validate staging scripts and refuse production root
        run: |
          bash -n scripts/deployment/deploy-staging.sh
          php -l scripts/deployment/configure-staging.php
          php -l scripts/deployment/staging-config.php
          php -l scripts/testing/staging-functional-guard.php
          php -l scripts/testing/staging-preservation-readonly.php
          node --check scripts/testing/staging-browser-smoke.mjs
          node --check scripts/testing/staging-functional-browser.mjs
          python3 tests/deployment/test_staging_secrets.py
          python3 tests/deployment/test_staging_deploy.py
          if bash scripts/deployment/deploy-staging.sh /home/u304629909/domains/tinggaljalan.com invalid invalid invalid invalid; then
            echo 'Production root was accepted.' >&2
            exit 1
          fi

  credentials:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate all credential fields before building
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: python3 scripts/deployment/prepare-staging-secrets.py

  review-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.review_only
    needs: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare private browser credentials
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/deployment/prepare-staging-secrets.py "$RUNNER_TEMP/browser-review/config.json"
      - name: Verify isolated database and disabled integrations before submissions
        if: inputs.functional_checks
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/browser-review/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/browser-review/known_hosts"
          ssh -p 65002 -i "$RUNNER_TEMP/browser-review/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/browser-review/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            u304629909@153.92.9.54 "/opt/alt/php84/usr/bin/php /dev/stdin '$REVISION'" \
            < scripts/testing/staging-functional-guard.php
      - name: Snapshot public content and verify isolation without database writes
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/staging-review"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/browser-review/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/browser-review/known_hosts"
          ssh -p 65002 -i "$RUNNER_TEMP/browser-review/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/browser-review/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            u304629909@153.92.9.54 "/opt/alt/php84/usr/bin/php /dev/stdin '$REVISION'" \
            < scripts/testing/staging-preservation-readonly.php > "$RUNNER_TEMP/staging-review/preservation-before.json"
      - name: Download read-only preservation baseline
        uses: actions/download-artifact@v4
        with:
          name: staging-review-38001811945-1
          run-id: 38001811945
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preservation-baseline
      - name: Compare content and media across preview deployment
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const before = JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/preservation-baseline/preservation-before.json'));
          const after = JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/staging-review/preservation-before.json'));
          const oldRevision = before.revision;
          delete before.revision;
          delete after.revision;
          delete before.production_revision;
          delete after.production_revision;
          assert.deepEqual(after,before,'Public content, branding, media and isolation must stay unchanged across deployment.');
          const evidence = { previousPreviewRevision:oldRevision, productionRevision:JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/staging-review/preservation-before.json')).production_revision, deployedRevision:JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/staging-review/preservation-before.json')).revision, unchanged:true, snapshot:after };
          writeFileSync(process.env.RUNNER_TEMP+'/staging-review/preservation-comparison.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - name: Remove only six explicitly approved inactive production artifacts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const snapshot = JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/staging-review/preservation-before.json'));
          assert.equal(snapshot.production_revision,'a777cb7b8608ed3028f5709fad50fe3bbc801d9a');
          assert.equal(snapshot.revision,'05a12039b72a7035e8990dfe4793fd6bf51dbc7a');
          NODE
          ssh -p 65002 -i "$RUNNER_TEMP/browser-review/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/browser-review/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            u304629909@153.92.9.54 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/staging-review/approved-cleanup.txt"
          set -euo pipefail
          root=/home/u304629909/domains/tinggaljalan.com/deployments
          current=a777cb7b8608ed3028f5709fad50fe3bbc801d9a
          inactive=d87bf649b8894c08c9e1302f2fe2e7f5d516d0cb
          new=627978e8114683c284c394499bbf1cdc2bcced26
          [[ "$(readlink -f "$root/current")" == "$root/releases/$current" ]]
          [[ -d "$root/releases/$inactive" && ! -L "$root/releases/$inactive" ]]
          [[ "$(realpath "$root/releases/$inactive")" == "$root/releases/$inactive" ]]
          [[ "$(realpath "$root/releases")" == "$root/releases" ]]
          [[ "$(realpath "$root/incoming")" == "$root/incoming" ]]
          [[ -f "$root/incoming/release-$new.tar.gz" && ! -L "$root/incoming/release-$new.tar.gz" ]]
          [[ "$(stat -c %s "$root/incoming/release-$new.tar.gz")" == 86216649 ]]
          names=(5fe47ad36b032d328f85693e407016db494c887f d87bf649b8894c08c9e1302f2fe2e7f5d516d0cb 593d56541f9c0b5b5e2df024e32c9bbcc29c78cb 2195c4563bbb7b0805c7673ff89374e3f4294f6f d168bb0e64e1e2cb45735cadd36f09247d832fe1)
          sizes=(30780519 86217191 26870685 30780387 86188602)
          for i in "${!names[@]}"; do
            file="$root/incoming/release-${names[$i]}.tar.gz"
            [[ -f "$file" && ! -L "$file" ]]
            [[ "$(stat -c %s "$file")" == "${sizes[$i]}" ]]
            [[ "$(realpath "$file")" == "$file" ]]
          done
          before_releases=$(find "$root/releases" -mindepth 1 -maxdepth 1 -type d ! -name "$inactive" -printf '%f\n' | sort)
          before_archives=$(find "$root/incoming" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          echo "APPROVED_CLEANUP_BEGIN active=$current keep_new_archive=$new"
          du -sk "$root/releases/$inactive"
          # rm unlinks symlinks inside the inactive release; it does not traverse shared storage.
          rm -rf --one-file-system -- "$root/releases/$inactive"
          for i in "${!names[@]}"; do
            rm -- "$root/incoming/release-${names[$i]}.tar.gz"
            echo "REMOVED release-${names[$i]}.tar.gz ${sizes[$i]} bytes"
          done
          [[ ! -e "$root/releases/$inactive" ]]
          [[ "$(readlink -f "$root/current")" == "$root/releases/$current" ]]
          [[ -f "$root/incoming/release-$new.tar.gz" ]]
          [[ "$before_releases" == "$(find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)" ]]
          echo "REMOVED inactive release $inactive"
          echo 'APPROVED_CLEANUP_END'
          REMOTE
      - name: Verify public content and media stayed unchanged during review
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          ssh -p 65002 -i "$RUNNER_TEMP/browser-review/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/browser-review/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            u304629909@153.92.9.54 "/opt/alt/php84/usr/bin/php /dev/stdin '$REVISION'" \
            < scripts/testing/staging-preservation-readonly.php > "$RUNNER_TEMP/staging-review/preservation-after.json"
          cmp "$RUNNER_TEMP/staging-review/preservation-before.json" "$RUNNER_TEMP/staging-review/preservation-after.json"
      - name: Verify synthetic booking and admin sign-in on desktop and mobile
        if: inputs.functional_checks
        env:
          REVISION: ${{ inputs.revision }}
        run: node scripts/testing/staging-functional-browser.mjs "$RUNNER_TEMP/browser-review/config.json" "$REVISION" "$RUNNER_TEMP/staging-review" "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-review
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-loading-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging-review/loading
            ${{ runner.temp }}/staging-review/preservation-comparison.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove browser credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/browser-review"

