name: Protected staging deployment
on:
  workflow_dispatch:
    inputs:
      review_only:
        description: Local fixture screenshot review only; cannot deploy
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  local-fixture-evidence:
    if: inputs.review_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92e09992bc5075ee118ebd53f9a748b61e887f79
          path: before
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, curl, zip, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated local fixtures
        run: |
          for directory in before after; do
            (
              cd "$directory"
              composer install --prefer-dist --no-interaction --no-progress
              npm ci
              cp .env.example .env
              php artisan key:generate
              npm run test:browser:prepare
            )
          done
          cd after
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-f95710125c848dedd5aff9ff39d3ae4bf00518fb
          run-id: 37936300938
          github-token: ${{ github.token }}
          path: before/public
      - uses: actions/download-artifact@v4
        with:
          name: frontend-92155edefdbe427e78e9dbca5676ff8edc18c766
          run-id: 37957829637
          github-token: ${{ github.token }}
          path: after/public
      - name: Capture same-data before and after
        run: node after/scripts/testing/local-continuity-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-continuity-review
          path: ${{ runner.temp }}/continuity-review
          retention-days: 7
