name: Protected staging deployment
on:
  workflow_dispatch:
    inputs:
      review_only:
        description: Read-only evidence extraction; this workflow cannot deploy
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  summarize-existing-evidence:
    if: inputs.review_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: initial-loading-review-37937499311
          run-id: 37937499311
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review
      - uses: actions/download-artifact@v4
        with:
          name: staging-review-37935716462-1
          run-id: 37935716462
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/public-pages
      - name: Publish compact public-page review evidence
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/review';
          const output=process.env.RUNNER_TEMP+'/summary';
          mkdirSync(output,{recursive:true});
          const metrics=JSON.parse(readFileSync(root+'/loading/loading-verification.json'));
          const preservation=JSON.parse(readFileSync(root+'/preservation-comparison.json'));
          console.log('TJ_REVIEW_JSON:'+JSON.stringify({metrics,preservation}));
          writeFileSync(output+'/preview-verification.json',JSON.stringify({metrics,preservation},null,2));
          const publicRoot=process.env.RUNNER_TEMP+'/public-pages';
          const verification=readFileSync(publicRoot+'/verification.txt','utf8');
          console.log('TJ_SEO_TEXT:'+JSON.stringify(verification));
          writeFileSync(output+'/seo-verification.txt',verification);
          const shots=['desktop-us-initial','desktop-us-react','mobile-us-initial','mobile-us-react'];
          const sheets=[];
          for(let i=0;i<shots.length;i++){
            const image=await sharp(root+'/loading/'+shots[i]+'.png').resize({width:i<2?680:320}).toBuffer();
            sheets.push({input:image,left:i<2?i*680:(i-2)*340+340,top:i<2?40:560});
          }
          const labels='<svg width="1360" height="40"><rect width="1360" height="40" fill="#fff"/><text x="12" y="26" font-size="20">Initial HTML (left) → React (right); desktop above, mobile below</text></svg>';
          const jpg=await sharp({create:{width:1360,height:1310,channels:3,background:'#eeeeee'}}).composite([{input:Buffer.from(labels),left:0,top:0},...sheets]).jpeg({quality:65}).toBuffer();
          writeFileSync(output+'/preview-loading-comparison.jpg',jpg);
          const b64=jpg.toString('base64');
          for(let i=0;i<b64.length;i+=3000) console.log('TJ_REVIEW_IMAGE:'+b64.slice(i,i+3000));
          for(const profile of ['desktop','mobile']){
            const labels=['bromo-article','ijen-article','bukit-lawang-article','bromo-route','home','routes','news','about','privacy'];
            const tiles=[];
            const width=profile==='desktop'?300:195;
            const tileHeight=profile==='desktop'?233:446;
            for(let i=0;i<labels.length;i++){
              for(let scroll=0;scroll<4;scroll++){
                const index=i*4+scroll;
                const image=await sharp(publicRoot+'/'+profile+'-'+labels[i]+'-scroll-'+scroll+'.png').resize({width}).toBuffer();
                tiles.push({input:image,left:scroll*width,top:i*tileHeight+24});
                const label='<svg width="'+width+'" height="24"><rect width="100%" height="100%" fill="white"/><text x="5" y="17" font-size="12">'+labels[i]+' / '+scroll+'</text></svg>';
                tiles.push({input:Buffer.from(label),left:scroll*width,top:i*tileHeight});
              }
            }
            const image=await sharp({create:{width:4*width,height:9*tileHeight,channels:3,background:'#eeeeee'}}).composite(tiles).jpeg({quality:65}).toBuffer();
            writeFileSync(output+'/'+profile+'-public-pages.jpg',image);
            const encoded=image.toString('base64');
            for(let i=0;i<encoded.length;i+=3000) console.log('TJ_'+profile.toUpperCase()+'_IMAGE:'+encoded.slice(i,i+3000));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: compact-preview-review
          path: ${{ runner.temp }}/summary
          retention-days: 7
