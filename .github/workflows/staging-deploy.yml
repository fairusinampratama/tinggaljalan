name: Protected staging deployment

# Compatibility entry point. All privileged release rules live in the current
# main controller rather than a branch-specific copy of the old deploy jobs.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact candidate commit; empty uses the selected main revision
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/prepare-preview-release.yml
    with:
      source_sha: ${{ inputs.source_sha }}
