name: Approved inactive preview release cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Remove only the two owner-approved inactive preview release copies
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/capacity-private"
          trap 'rm -rf -- "$RUNNER_TEMP/capacity-private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/capacity-private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/capacity-private/known_hosts"
          ssh -p 65002 -i "$RUNNER_TEMP/capacity-private/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/capacity-private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 u304629909@153.92.9.54 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/home/u304629909/domains/preview.tinggaljalan.com
          deploy="$root/deployments"
          [[ "$(readlink -f "$root")" == "$root" ]]
          [[ "$(cat "$root/.tinggaljalan-staging")" == preview.tinggaljalan.com ]]
          [[ ! -L "$deploy/releases" && ! -L "$deploy/incoming" ]]
          exec 9>"$deploy/.lock"
          flock -w 60 9
          releases="$deploy/releases"
          [[ "$(readlink -f "$releases")" == "$releases" ]]
          before_current="$(readlink -f "$deploy/current")"
          [[ "$before_current" == "$releases/627978e8114683c284c394499bbf1cdc2bcced26" ]]
          [[ -d "$releases/758e3e3cecdb4724b58eded028645506e4d1018e" ]]
          targets=(05a12039b72a7035e8990dfe4793fd6bf51dbc7a 089299c7d5765572e5b056bf468ab51f8bd41a1b)
          for sha in "${targets[@]}"; do
            directory="$releases/$sha"
            [[ -d "$directory" && ! -L "$directory" ]]
            [[ "$(readlink -f "$directory")" == "$directory" ]]
            [[ "$directory" != "$before_current" ]]
            [[ -L "$directory/.env" && -L "$directory/storage" ]]
            [[ "$(readlink -f "$directory/.env")" == "$deploy/shared/.env" ]]
            [[ "$(readlink -f "$directory/storage")" == "$deploy/shared/storage" ]]
          done
          before_kib="$(du -sk "$releases" | cut -f1)"
          before_files="$(find "$releases" -xdev -type f | wc -l)"
          before_env="$(sha256sum "$deploy/shared/.env")"
          media_digest() {
            find "$deploy/shared/storage/app/public" -xdev -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum
          }
          before_media="$(media_digest)"
          other_releases() {
            find "$releases" -mindepth 1 -maxdepth 1 -type d ! -name "${targets[0]}" ! -name "${targets[1]}" -printf '%f\n' | sort
          }
          before_others="$(other_releases)"
          for sha in "${targets[@]}"; do
            [[ "$(readlink -f "$deploy/current")" == "$before_current" ]]
            rm -rf --one-file-system -- "$releases/$sha"
            [[ ! -e "$releases/$sha" && ! -L "$releases/$sha" ]]
          done
          [[ "$(readlink -f "$deploy/current")" == "$before_current" ]]
          [[ -d "$before_current" && -d "$releases/758e3e3cecdb4724b58eded028645506e4d1018e" ]]
          [[ "$(sha256sum "$deploy/shared/.env")" == "$before_env" ]]
          [[ "$(media_digest)" == "$before_media" ]]
          [[ "$(other_releases)" == "$before_others" ]]
          after_kib="$(du -sk "$releases" | cut -f1)"
          after_files="$(find "$releases" -xdev -type f | wc -l)"
          printf 'APPROVED_CLEANUP_COMPLETE removed_releases=2 reclaimed_KiB=%s removed_files=%s\n' "$((before_kib-after_kib))" "$((before_files-after_files))"
          echo CURRENT_PHOTO_RELEASES_OTHER_RELEASES_CONFIG_AND_MEDIA_PRESERVED
          REMOTE
