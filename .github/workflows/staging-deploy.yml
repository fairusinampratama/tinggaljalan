name: News inline photographs — hosted preview verification
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact approved deployed preview revision
        required: true
        type: string
        default: 758e3e3cecdb4724b58eded028645506e4d1018e
      fixture_run:
        description: Existing synthetic article run (read-only)
        required: true
        type: string
        default: 39724985689-1
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Validate review scripts
        run: |
          php -l scripts/testing/news-preview-fixture.php
          node --check scripts/testing/news-preview-review.mjs
      - name: Prepare private preview review
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REVIEW_PASSWORD: ${{ secrets.STAGING_REVIEW_PASSWORD }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" == 758e3e3cecdb4724b58eded028645506e4d1018e ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/news-private" "$RUNNER_TEMP/news-review"
          python3 scripts/deployment/prepare-staging-secrets.py "$RUNNER_TEMP/news-private/config.json"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/news-private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/news-private/known_hosts"
          cat > "$RUNNER_TEMP/news-private/ssh_config" <<CONFIG
          Host staging
              HostName 153.92.9.54
              Port 65002
              User u304629909
              IdentityFile $RUNNER_TEMP/news-private/key
              UserKnownHostsFile $RUNNER_TEMP/news-private/known_hosts
              StrictHostKeyChecking yes
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 20
          CONFIG
      - name: Install browser review dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify isolation and record preservation baseline
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          ssh -F "$RUNNER_TEMP/news-private/ssh_config" staging "/opt/alt/php84/usr/bin/php /dev/stdin '$REVISION'" < scripts/testing/staging-functional-guard.php
          ssh -F "$RUNNER_TEMP/news-private/ssh_config" staging "/opt/alt/php84/usr/bin/php /dev/stdin '$REVISION'" < scripts/testing/staging-preservation-readonly.php > "$RUNNER_TEMP/news-review/preservation-before.json"
      - name: Inspect existing uploaded photographs without content changes
        env:
          REVISION: ${{ inputs.revision }}
          FIXTURE_RUN: ${{ inputs.fixture_run }}
        run: node scripts/testing/news-preview-review.mjs "$RUNNER_TEMP/news-private/config.json" "$REVISION" "$RUNNER_TEMP/news-review" "$FIXTURE_RUN" "$RUNNER_TEMP/news-private/ssh_config"
      - name: Verify public branding and production preservation
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          ssh -F "$RUNNER_TEMP/news-private/ssh_config" staging "/opt/alt/php84/usr/bin/php /dev/stdin '$REVISION'" < scripts/testing/staging-preservation-readonly.php > "$RUNNER_TEMP/news-review/preservation-after.json"
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'news-review'
          before=json.loads((root/'preservation-before.json').read_text())
          after=json.loads((root/'preservation-after.json').read_text())
          for key in ['production_public_content','production_media','production_revision','logo_url','production_logo_url','production_pending_migrations']:
              assert before[key] == after[key], key
          for key, value in before['public_content'].items():
              if key != 'news_articles': assert value == after['public_content'][key], key
          assert after['public_content']['news_articles']['count'] == before['public_content']['news_articles']['count']
          print('Existing public branding, non-test content and production preservation passed.')
          PYVERIFY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-hosted-preview-review
          path: ${{ runner.temp }}/news-review
          retention-days: 7
      - name: Remove private review credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/news-private"
