name: GA4 deployment capacity recovery (approval required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Remove only the two owner-approved obsolete deployment artifacts
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DOMAIN_ROOT: ${{ secrets.PROD_DOMAIN_ROOT }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/ga4-capacity"
          mkdir -p "$private"
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$private/known_hosts"
          ssh -p "$SSH_PORT" -i "$private/key" \
            -o UserKnownHostsFile="$private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DOMAIN_ROOT'" <<'REMOTE'
          set -euo pipefail
          root="$1"
          [[ "$root" == /home/*/domains/tinggaljalan.com ]]
          [[ "$(readlink -f "$root")" == "$root" ]]
          active="$root/deployments/releases/2ebe7063298c7657955f9640c5aedda83f56d446"
          rollback="$root/deployments/releases/babda3db8b86d95b3dff2fa634988724cd85da56"
          candidate="$root/deployments/releases/f2f2817f8c1e3bd459d64dfb0d86e7b5f7a40658"
          archive="$root/deployments/incoming/release-d55f9a35243f2da15e9856c7667518623a198332.tar.gz"
          [[ "$(readlink -f "$root/deployments/current")" == "$active" ]]
          [[ "$(cat "$active/REVISION")" == 2ebe7063298c7657955f9640c5aedda83f56d446 ]]
          [[ "$(cat "$rollback/REVISION")" == babda3db8b86d95b3dff2fa634988724cd85da56 ]]
          [[ -d "$candidate" && ! -L "$candidate" ]]
          [[ "$(readlink -f "$candidate")" == "$candidate" ]]
          [[ "$(cat "$candidate/REVISION")" == f2f2817f8c1e3bd459d64dfb0d86e7b5f7a40658 ]]
          [[ -f "$archive" && ! -L "$archive" ]]
          [[ "$(readlink -f "$archive")" == "$archive" ]]
          test -d "$root/deployments/shared/storage/app/public"
          test -d "$root/deployments/shared/backups"
          env_fingerprint="$(sha256sum "$root/deployments/shared/.env" | cut -d' ' -f1)"
          before_kib="$(du -sk "$candidate" | cut -f1)"
          archive_bytes="$(stat -c '%s' "$archive")"
          # Exact targets only. rm does not follow symlinks inside a release.
          rm -rf -- "$candidate"
          rm -f -- "$archive"
          test ! -e "$candidate"
          test ! -e "$archive"
          [[ "$(readlink -f "$root/deployments/current")" == "$active" ]]
          [[ "$(cat "$active/REVISION")" == 2ebe7063298c7657955f9640c5aedda83f56d446 ]]
          [[ "$(cat "$rollback/REVISION")" == babda3db8b86d95b3dff2fa634988724cd85da56 ]]
          [[ "$(sha256sum "$root/deployments/shared/.env" | cut -d' ' -f1)" == "$env_fingerprint" ]]
          test -d "$root/deployments/shared/storage/app/public"
          test -d "$root/deployments/shared/backups"
          printf 'Removed obsolete release f2f2817f8c1e3bd459d64dfb0d86e7b5f7a40658: %s KiB\n' "$before_kib"
          printf 'Removed reproducible d55f9a3 archive: %s bytes\n' "$archive_bytes"
          echo 'Active release, previous rollback, shared config, media and backups preserved.'
          REMOTE
