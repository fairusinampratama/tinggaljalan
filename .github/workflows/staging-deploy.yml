name: Approved failed-build cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Remove only the two approved inactive failed-build artifacts
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          DOMAIN_ROOT: ${{ secrets.PROD_DOMAIN_ROOT }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/failed-build-cleanup"
          mkdir -p "$private"
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$private/known_hosts"
          ssh -p "$SSH_PORT" -i "$private/key" \
            -o UserKnownHostsFile="$private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DOMAIN_ROOT'" <<'REMOTE'
          set -euo pipefail
          root="$1"
          [[ "$root" == /* && "$root" != / && "$root" != /home ]]
          [[ "$(readlink -f "$root")" == "$root" ]]
          deploy="$root/deployments"
          [[ ! -L "$deploy/releases" && ! -L "$deploy/incoming" ]]
          [[ "$(readlink -f "$deploy/releases")" == "$deploy/releases" ]]
          sha=af9218c2e4f05af7a4cb8676704747d26cd2c45c
          failed="$deploy/releases/$sha"
          archive="$deploy/incoming/release-$sha.tar.gz"
          current="$(readlink -f "$deploy/current")"
          next="$deploy/incoming/release-babda3db8b86d95b3dff2fa634988724cd85da56.tar.gz"
          [[ "$current" == "$deploy/releases/627978e8114683c284c394499bbf1cdc2bcced26" ]]
          [[ "$(readlink -f "$root/tinggaljalan-app")" == "$current" ]]
          [[ "$(cat "$current/REVISION")" == 627978e8114683c284c394499bbf1cdc2bcced26 ]]
          [[ -d "$failed" && ! -L "$failed" && "$failed" != "$current" ]]
          [[ "$(readlink -f "$failed")" == "$failed" ]]
          [[ "$(cat "$failed/REVISION")" == "$sha" ]]
          [[ -L "$failed/.env" && -L "$failed/storage" && -L "$failed/public/storage" ]]
          [[ "$(readlink -f "$failed/.env")" == "$deploy/shared/.env" ]]
          [[ "$(readlink -f "$failed/storage")" == "$deploy/shared/storage" ]]
          [[ "$(readlink -f "$failed/public/storage")" == "$deploy/shared/storage/app/public" ]]
          [[ -f "$archive" && ! -L "$archive" && -f "$next" && ! -L "$next" ]]
          [[ "$(tar -xOf "$archive" ./REVISION | tr -d '[:space:]')" == "$sha" ]]
          [[ ! -e "$deploy/releases/babda3db8b86d95b3dff2fa634988724cd85da56" ]]
          media_digest() {
            find "$deploy/shared/storage/app/public" -xdev -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum
          }
          other_releases() {
            find "$deploy/releases" -mindepth 1 -maxdepth 1 -type d ! -name "$sha" -printf '%f\n' | sort
          }
          before_media="$(media_digest)"
          before_env="$(sha256sum "$deploy/shared/.env")"
          before_others="$(other_releases)"
          before_next="$(sha256sum "$next")"
          reclaimed="$(du -sk "$failed" "$archive" | awk '{sum+=$1} END {print sum}')"
          [[ "$(readlink -f "$deploy/current")" == "$current" ]]
          rm -rf --one-file-system -- "$failed"
          rm -f -- "$archive"
          [[ ! -e "$failed" && ! -e "$archive" ]]
          [[ "$(readlink -f "$deploy/current")" == "$current" ]]
          [[ "$(sha256sum "$deploy/shared/.env")" == "$before_env" ]]
          [[ "$(media_digest)" == "$before_media" ]]
          [[ "$(other_releases)" == "$before_others" ]]
          [[ "$(sha256sum "$next")" == "$before_next" ]]
          printf 'APPROVED_FAILED_BUILD_REMOVED reclaimed_KiB=%s\n' "$reclaimed"
          echo ACTIVE_RELEASE_OTHER_RELEASES_NEXT_ARTIFACT_CONFIGURATION_AND_MEDIA_PRESERVED
          REMOTE
