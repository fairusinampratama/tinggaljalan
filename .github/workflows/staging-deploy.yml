name: Read-only preview capacity inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Inspect account quota and preview release artifacts without hosting writes
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/capacity-private"
          trap 'rm -rf -- "$RUNNER_TEMP/capacity-private"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/capacity-private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/capacity-private/known_hosts"
          ssh -p 65002 -i "$RUNNER_TEMP/capacity-private/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/capacity-private/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 u304629909@153.92.9.54 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/home/u304629909/domains/preview.tinggaljalan.com
          deploy="$root/deployments"
          [[ "$(readlink -f "$root")" == "$root" ]]
          [[ "$(cat "$root/.tinggaljalan-staging")" == preview.tinggaljalan.com ]]
          [[ ! -L "$deploy/releases" && ! -L "$deploy/incoming" ]]
          echo QUOTA
          quota -s 2>/dev/null || true
          df -Pk "$root"
          df -Pi "$root"
          echo CURRENT_PREVIEW
          readlink -f "$deploy/current"
          echo PREVIEW_TOTALS_KIB
          du -sk "$deploy/releases" "$deploy/incoming" "$deploy/shared/storage" "$deploy/shared/backups" 2>/dev/null || true
          echo PREVIEW_RELEASES_KIB_FILES
          find "$deploy/releases" -mindepth 1 -maxdepth 1 -type d -print | sort | while IFS= read -r directory; do
            du -sk "$directory"
            printf 'FILES %s ' "$(basename "$directory")"
            find "$directory" -xdev -type f | wc -l
          done
          echo PREVIEW_INCOMING_FILES
          find "$deploy/incoming" -mindepth 1 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo PUBLIC_ENTRY_FILES
          find "$root/public_html" -mindepth 1 -maxdepth 1 -type f -name 'index-*.php' -printf '%f\n' | sort
          echo READ_ONLY_INSPECTION_COMPLETE
          REMOTE
