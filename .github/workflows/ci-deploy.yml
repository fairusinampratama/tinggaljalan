name: Validate changes and build release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision selected by the trusted preview controller
        type: string
        required: true
      build_candidate:
        description: Package the tested candidate for the trusted preview controller
        type: boolean
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.package-release.outputs.source_sha }}
      archive_sha256:
        value: ${{ jobs.package-release.outputs.archive_sha256 }}
      artifact_name:
        value: ${{ jobs.package-release.outputs.artifact_name }}
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Only obsolete PR validation is cancelled. A manually requested release has its
# own run identity and must never be interrupted by another push or request.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate exact source revision
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2; verified CI revision
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; verified CI revision
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4; verified CI revision
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install build dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Build frontend once
        run: npm run build:performance

      - name: Upload built frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified CI revision
        with:
          name: frontend-${{ env.SOURCE_SHA }}
          path: |
            public/build
            public/images/generated
          if-no-files-found: error
          retention-days: 1

  php-tests:
    name: PHP quality and tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2; verified CI revision
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4; verified CI revision
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Download built frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; verified CI revision
        with:
          name: frontend-${{ env.SOURCE_SHA }}
          path: public

      - name: Verify image runtime
        run: |
          php -r "exit(extension_loaded('gd') && function_exists('imagewebp') ? 0 : 1);"

      - name: Check changed PHP formatting
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/pint-changed.sh

      - name: Validate deployment scripts
        run: |
          bash -n \
            scripts/deployment/build-release.sh \
            scripts/deployment/deploy-hostinger.sh \
            scripts/deployment/health-check.sh \
            scripts/deployment/production-smoke-test.sh \
            scripts/deployment/seo-smoke-test.sh \
            scripts/deployment/rollback-hostinger.sh

      - name: Test account capacity and release retention safety
        run: |
          python3 tests/deployment/test_hosting_maintenance.py
          python3 tests/deployment/test_production_recovery.py
          python3 tests/deployment/test_release_provenance.py
          python3 tests/deployment/test_preview_release_state.py

      - name: Test release control safety
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 tests/deployment/test_release_controls.py

      - name: Verify staging configuration and deployment regressions
        run: |
          php tests/deployment/test_staging_config.php
          python3 tests/deployment/test_staging_secrets.py
          python3 tests/deployment/test_staging_deploy.py
          node --test tests/deployment/test_public_review_routes.mjs
          node --check scripts/testing/staging-browser-smoke.mjs
          bash -n scripts/deployment/deploy-staging.sh

      - name: Run Laravel tests
        run: composer test

  browser-tests:
    name: Cross-browser responsive tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2; verified CI revision
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; verified CI revision
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4; verified CI revision
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Download built frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; verified CI revision
        with:
          name: frontend-${{ env.SOURCE_SHA }}
          path: public

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run responsive tests
        run: npm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified CI revision
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  package-release:
    name: Package immutable release
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      archive_sha256: ${{ steps.metadata.outputs.archive_sha256 }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    needs: [frontend-build, php-tests, browser-tests]
    if: inputs.build_candidate && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified CI revision
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2; verified CI revision
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4; verified CI revision
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-production-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-production-
            ${{ runner.os }}-php84-

      - name: Prepare packaging environment
        run: cp .env.example .env

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Generate temporary application key
        run: php artisan key:generate

      - name: Check production platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Download validated frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; verified CI revision
        with:
          name: frontend-${{ env.SOURCE_SHA }}
          path: public

      - name: Build immutable release
        run: bash scripts/deployment/build-release.sh "$SOURCE_SHA" "$RUNNER_TEMP/release-$SOURCE_SHA.tar.gz"

      - name: Record immutable candidate metadata
        id: metadata
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          source = os.environ['SOURCE_SHA']
          directory = Path(os.environ['RUNNER_TEMP'])
          archive = directory / ('release-' + source + '.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          metadata = dict(source_sha=source, archive_sha256=digest, format_version=1)
          (directory / 'candidate.json').write_text(json.dumps(metadata))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_sha=' + source + '\narchive_sha256=' + digest + '\nartifact_name=candidate-' + source + '\n')
          PYTHON

      - name: Upload immutable release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified CI revision
        with:
          name: candidate-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/release-${{ env.SOURCE_SHA }}.tar.gz
            ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 14
