name: CI and production deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install build dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Build frontend once
        run: npm run build:performance

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: |
            public/build
            public/images/generated
          if-no-files-found: error
          retention-days: 1

  php-tests:
    name: PHP quality and tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: public

      - name: Verify image runtime
        run: |
          php -r "exit(extension_loaded('gd') && function_exists('imagewebp') ? 0 : 1);"

      - name: Check changed PHP formatting
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/pint-changed.sh

      - name: Validate deployment scripts
        run: |
          bash -n \
            scripts/deployment/build-release.sh \
            scripts/deployment/deploy-hostinger.sh \
            scripts/deployment/health-check.sh \
            scripts/deployment/production-smoke-test.sh \
            scripts/deployment/seo-smoke-test.sh \
            scripts/deployment/rollback-hostinger.sh

      - name: Run Laravel tests
        run: composer test

  browser-tests:
    name: Cross-browser responsive tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: public

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run responsive tests
        run: npm run test:browser

  package-release:
    name: Package immutable release
    needs: [frontend-build, php-tests, browser-tests]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out validated source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php84-production-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-production-
            ${{ runner.os }}-php84-

      - name: Prepare packaging environment
        run: cp .env.example .env

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Generate temporary application key
        run: php artisan key:generate

      - name: Check production platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: public

      - name: Build immutable release
        run: bash scripts/deployment/build-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/release-$GITHUB_SHA.tar.gz"

      - name: Upload immutable release
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.sha }}
          path: ${{ runner.temp }}/release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    needs: package-release
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, hostinger-production]
    timeout-minutes: 90
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    outputs:
      deployed_sha: ${{ steps.release.outputs.deployed_sha }}
      previous_sha: ${{ steps.previous.outputs.previous_sha }}
    env:
      PRODUCTION_URL: https://tinggaljalan.com
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      DOMAIN_ROOT: ${{ secrets.PROD_DOMAIN_ROOT }}

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Download immutable release
        uses: actions/download-artifact@v4
        with:
          name: production-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Validate deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$DOMAIN_ROOT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure pinned SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production" "$HOME/.ssh/known_hosts"

      - name: Verify production SSH reachability
        run: |
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            "printf 'Production SSH reachable\n'"

      - name: Record previous release
        id: previous
        run: |
          previous_sha="$(ssh \
            -i "$HOME/.ssh/production" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "if test -f '$DOMAIN_ROOT/deployments/current/REVISION'; then tr -d '[:space:]' < '$DOMAIN_ROOT/deployments/current/REVISION'; fi")"
          [[ -z "$previous_sha" || "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Upload release
        env:
          ARCHIVE: ${{ runner.temp }}/release/release-${{ github.sha }}.tar.gz
        run: |
          REMOTE_ARCHIVE="$DOMAIN_ROOT/deployments/incoming/release-$GITHUB_SHA.tar.gz"
          REMOTE_PART="$REMOTE_ARCHIVE.part"
          LOCAL_SIZE="$(stat -c '%s' "$ARCHIVE")"
          LOCAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DOMAIN_ROOT/deployments/incoming'"

          uploaded=0
          for attempt in 1 2 3; do
            ssh \
              -i "$HOME/.ssh/production" \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_PART'"

            if scp \
              -i "$HOME/.ssh/production" \
              -P "$SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$ARCHIVE" \
              "$SSH_USER@$SSH_HOST:$REMOTE_PART"; then
              REMOTE_METADATA="$(ssh \
                -i "$HOME/.ssh/production" \
                -p "$SSH_PORT" \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                "$SSH_USER@$SSH_HOST" \
                "printf '%s ' \"\$(stat -c '%s' '$REMOTE_PART')\"; sha256sum '$REMOTE_PART' | cut -d' ' -f1")"

              if [[ "$REMOTE_METADATA" == "$LOCAL_SIZE $LOCAL_SHA256" ]]; then
                ssh \
                  -i "$HOME/.ssh/production" \
                  -p "$SSH_PORT" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=20 \
                  "$SSH_USER@$SSH_HOST" \
                  "mv '$REMOTE_PART' '$REMOTE_ARCHIVE'"
                uploaded=1
                break
              fi
            fi

            echo "Release upload attempt $attempt failed integrity verification." >&2
          done

          [[ "$uploaded" == "1" ]] || {
            echo 'Release upload failed after three integrity-checked attempts.' >&2
            exit 1
          }

      - name: Deploy atomic release
        run: |
          REMOTE_ARCHIVE="$DOMAIN_ROOT/deployments/incoming/release-$GITHUB_SHA.tar.gz"
          ssh \
            -i "$HOME/.ssh/production" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DOMAIN_ROOT' '$GITHUB_SHA' '$REMOTE_ARCHIVE' '$PRODUCTION_URL'" \
            < scripts/deployment/deploy-hostinger.sh

      - name: Expose deployed revision
        id: release
        run: echo "deployed_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Record deployment summary
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        run: |
          {
            echo '## Production deployment'
            echo
            echo "- Deployed revision: \`$GITHUB_SHA\`"
            echo "- Previous revision: \`${PREVIOUS_SHA:-initial-release}\`"
            echo "- URL: $PRODUCTION_URL"
            echo '- Strategy: prewarmed atomic symlink release'
            echo '- Host-side health check: passed (automatic rollback gate)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deployment key from runner
        if: always()
        run: rm -f "$HOME/.ssh/production"

  production-smoke:
    name: Verify deployed production
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://tinggaljalan.com

    steps:
      - name: Check out smoke test
        uses: actions/checkout@v4

      - name: Run independent production smoke test
        run: bash scripts/deployment/production-smoke-test.sh "$PRODUCTION_URL" "${{ needs.deploy.outputs.deployed_sha }}" "$RUNNER_TEMP/production-smoke"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/production-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Record smoke-test summary
        if: always()
        run: |
          {
            echo '## Independent production smoke test'
            echo
            echo "- Expected revision: \`${{ needs.deploy.outputs.deployed_sha }}\`"
            echo "- Previous revision: \`${{ needs.deploy.outputs.previous_sha || 'initial-release' }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
