name: Read-only product production review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install public browser review dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify actual production without CMS or booking writes
        run: node scripts/testing/product-production-review.mjs d55f9a35243f2da15e9856c7667518623a198332 "$RUNNER_TEMP/production-product-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-product-review
          path: ${{ runner.temp }}/production-product-review
          if-no-files-found: warn
          retention-days: 7
